name: macOS VNC

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Download Vine Server 5.3.2
        shell: bash
        run: |
          set -euo pipefail

          DMG="$RUNNER_TEMP/VineServer-5.3.2.dmg"

          curl --fail --location --retry 3 \
            "https://github.com/stweil/OSXvnc/releases/download/V5.3.2/VineServer-5.3.2.dmg" \
            --output "$DMG"

          test -s "$DMG"

          echo "✅ Vine Server DMG downloaded:"
          ls -lh "$DMG"

      - name: Install Vine Server
        shell: bash
        run: |
          set -euo pipefail

          DMG="$RUNNER_TEMP/VineServer-5.3.2.dmg"
          MOUNT="$RUNNER_TEMP/vine-mount"

          mkdir -p "$MOUNT"

          hdiutil attach "$DMG" \
            -mountpoint "$MOUNT" \
            -nobrowse \
            -readonly

          APP_PATH=$(find "$MOUNT" \
            -maxdepth 2 \
            -type d \
            -name "*.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "❌ Vine Server application was not found."
            find "$MOUNT" -maxdepth 3 -print
            hdiutil detach "$MOUNT" || true
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/Vine Server.app"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Vine Server.app"

          hdiutil detach "$MOUNT"

          echo "✅ Vine Server installed at:"
          echo "$RUNNER_TEMP/Vine Server.app"

          echo "Application contents:"
          find "$RUNNER_TEMP/Vine Server.app/Contents/MacOS" \
            -maxdepth 1 \
            -type f \
            -print

      - name: Start Vine Server
        shell: bash
        run: |
          set -u

          APP="$RUNNER_TEMP/Vine Server.app"
          MACOS_DIR="$APP/Contents/MacOS"
          LOG="$RUNNER_TEMP/vine-server.log"

          echo "Vine Server application files:"
          find "$APP" -maxdepth 6 -type f -print

          echo ""
          echo "Executable information:"
          find "$MACOS_DIR" -maxdepth 1 -type f -print -exec file {} \;

          echo ""
          echo "macOS architecture:"
          uname -m

          echo ""
          echo "Trying to locate an actual VNC daemon..."

          VINE_DAEMON=$(find "$APP" \
            -type f \
            \( -iname '*server*' -o -iname '*vnc*' -o -iname '*osxvnc*' \) \
            -perm -111 \
            ! -name "Vine Server" \
            -print -quit)

          if [ -z "$VINE_DAEMON" ]; then
            echo "No separate VNC daemon found."
            echo "The DMG appears to contain only the Vine Server GUI launcher."
            echo ""
            echo "Available executables:"
            find "$APP" -type f -perm -111 -print
            exit 1
          fi

          chmod +x "$VINE_DAEMON"

          echo "Using VNC daemon:"
          echo "$VINE_DAEMON"

          file "$VINE_DAEMON"

          xattr -dr com.apple.quarantine "$APP" 2>/dev/null || true

          VINE_DIR="$(dirname "$VINE_DAEMON")"
          PASSFILE="$RUNNER_TEMP/vine-vnc.pass"

          STOREPASSWD="$VINE_DIR/storepasswd"

          if [ ! -x "$STOREPASSWD" ]; then
            STOREPASSWD=$(find "$APP" \
              -type f \
              -name "storepasswd" \
              -perm -111 \
              -print -quit)
          fi

          if [ -z "$STOREPASSWD" ] || [ ! -x "$STOREPASSWD" ]; then
            echo "❌ Vine storepasswd utility was not found."
            find "$APP" -type f -perm -111 -print
            exit 1
          fi

          # Vine's password format supports only the first 8 characters.
          "$STOREPASSWD" '12345678' "$PASSFILE"

          chmod 600 "$PASSFILE"

          "$VINE_DAEMON" \
            -rfbport 5900 \
            -rfbauth "$PASSFILE" \
            > "$LOG" 2>&1 &

          VINE_PID=$!
          echo "$VINE_PID" > vine.pid

          sleep 10

          echo "Vine Server log:"
          cat "$LOG" || true

          echo ""
          echo "Listening ports:"
          sudo lsof -nP -iTCP -sTCP:LISTEN || true

          if ! sudo lsof -nP -iTCP:5900 -sTCP:LISTEN; then
            echo "❌ Vine Server did not open port 5900."

            if ! kill -0 "$VINE_PID" 2>/dev/null; then
              echo "The Vine daemon exited."
            fi

            exit 1
          fi

          echo "✅ Vine Server is listening on port 5900."


      - name: Start Pinggy TCP Tunnel
        shell: bash
        run: |
          set -uo pipefail

          : > tunnel.log

          ssh -p 443 \
            -R 0:127.0.0.1:5900 \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            tcp@free.pinggy.io 2>&1 | tee -a tunnel.log &

          TUNNEL_PID=$!
          echo "$TUNNEL_PID" > tunnel.pid

          echo "Waiting for Pinggy endpoint..."

          for i in {1..30}; do
            ENDPOINT=$(grep -Eo 'tcp://[^[:space:]]+' tunnel.log | head -n 1 || true)

            if [ -n "$ENDPOINT" ]; then
              break
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "❌ Pinggy tunnel exited."
              cat tunnel.log
              exit 1
            fi

            sleep 2
          done

          ENDPOINT=$(grep -Eo 'tcp://[^[:space:]]+' tunnel.log | head -n 1 || true)

          if [ -z "$ENDPOINT" ]; then
            echo "❌ No Pinggy TCP endpoint was received."
            cat tunnel.log
            exit 1
          fi

          echo ""
          echo "============================================"
          echo "📋 VNC CONNECTION DETAILS"
          echo "============================================"
          echo "Endpoint: $ENDPOINT"
          echo "Authentication: VNC password"
          echo "============================================"

      - name: Keep Session Alive
        shell: bash
        run: |
          set -euo pipefail

          while true; do
            if ! kill -0 "$(cat tunnel.pid)" 2>/dev/null; then
              echo "❌ Pinggy tunnel exited."
              cat tunnel.log
              exit 1
            fi

            if ! kill -0 "$(cat vine.pid)" 2>/dev/null; then
              echo "❌ Vine Server exited."
              cat "$RUNNER_TEMP/vine-server.log"
              exit 1
            fi

            sleep 60
            echo "✓ Active - $(date '+%H:%M:%S')"
          done
